name: iOS CI

run-name: ${{ github.event_name == 'pull_request' && format('👀 {0}', github.event.pull_request.title) || github.event_name == 'push' && format('⛵ {0}', github.event.head_commit.message) || github.ref_name }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'cmd/ios-app/**'
      - '.swiftformat'
      - '.swiftlint.yml'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

# New PR updates (including a return to draft) supersede older test runs.
# Manual runs have independent groups and are never canceled by PR activity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run iOS Tests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    # GitHub-hosted only. A self-hosted runner would execute fork PR code on a
    # personal machine once the repository is public.
    runs-on: macos-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./cmd/ios-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi

      - name: Lint (SwiftFormat + SwiftLint)
        working-directory: .
        run: |
          for tool in swiftformat swiftlint; do
            if ! command -v "$tool" &> /dev/null; then
              HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install "$tool"
            fi
          done
          # Same command agents run locally; it switches to the GitHub reporter under Actions.
          ./cmd/ios-app/lint.sh

      - name: Run iOS Tests
        env:
          TMPDIR: /tmp
          # The optimized build compiles slower than Debug; stays inside the 15-minute job limit.
          PWUSAGE_TEST_TIMEOUT_SECONDS: 780
        # --full: optimized build plus the opt-in year-fixture parity suite (see run-tests.sh).
        run: ./run-tests.sh --full

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-test-artifacts
          # Only the result bundle (with on-failure diagnostics); DerivedData is gigabytes.
          path: /tmp/pwusage-ios-tests.*/**/TestResults.xcresult
          if-no-files-found: ignore
