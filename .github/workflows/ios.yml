name: iOS CI

run-name: ${{ github.event_name == 'workflow_dispatch' && format('🧪 Manual Run ({0})', github.ref_name) || github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    name: Run iOS Tests
    runs-on: macos-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./cmd/ios-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi

      - name: Run iOS Tests
        env:
          TMPDIR: /tmp
        run: ./run-tests.sh

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-test-artifacts
          path: /tmp/pwusage-ios-tests.*
          if-no-files-found: ignore
