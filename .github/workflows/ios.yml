name: iOS CI

run-name: ${{ github.event_name == 'pull_request' && format('👀 {0}', github.event.pull_request.title) || github.event_name == 'push' && format('⛵ {0}', github.event.head_commit.message) || github.ref_name }}

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/ios-app/**'
      - '.swiftformat'
      - '.swiftlint.yml'
      - '.github/workflows/ios.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'cmd/ios-app/**'
      - '.swiftformat'
      - '.swiftlint.yml'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

# New PR updates (including a return to draft) supersede older test runs.
# Manual runs have independent groups and are never canceled by PR activity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run iOS Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # GitHub-hosted only. A self-hosted runner would execute fork PR code on a
    # personal machine once the repository is public.
    # The macos-26 arm64 pool is failing hosted-runner acquisition (community
    # discussion #211885); macos-15 has a separate pool and Xcode 26.3.
    # TODO: return to macos-latest once the arm64 pool recovers.
    runs-on: macos-15
    # The hosted macOS pool can queue longer than the tests themselves; keep the job
    # alive for that wait. run-tests.sh still enforces its own limits: 15 minutes to boot
    # the simulator, then 20 for the tests, then 20 for the Debug build on main.
    # A job the pool never picks up is retried by ios-runner-retry.yml.
    timeout-minutes: 60

    defaults:
      run:
        working-directory: ./cmd/ios-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Fetch full history so detector_changed can find the merge base with origin/main.
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi

      - name: Lint (SwiftFormat + SwiftLint)
        working-directory: .
        run: |
          for tool in swiftformat swiftlint; do
            if ! command -v "$tool" &> /dev/null; then
              HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install "$tool"
            fi
          done
          # Same command agents run locally; it switches to the GitHub reporter under Actions.
          ./cmd/ios-app/lint.sh

      - name: Test runner checks
        run: ./test-run-tests.sh

      # A fresh checkout stamps every file with the checkout time, so Xcode would rebuild everything.
      # Giving each file its last commit time lets the cached build products below stay valid.
      - name: Restore source file times
        working-directory: .
        run: python3 cmd/ios-app/restore-git-mtimes.py cmd/ios-app

      # Pull requests build Debug and main builds optimized, so each keeps its own cache. A run starts from
      # the newest cache for its kind and saves its own when the tests pass.
      - name: Restore build products
        id: build-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: /tmp/pwusage-derived-data
          key: ios-derived-data-${{ runner.os }}-${{ github.event_name == 'pull_request' && 'pr' || 'full' }}-${{ hashFiles('cmd/ios-app/project.yml') }}-${{ github.sha }}
          restore-keys: |
            ios-derived-data-${{ runner.os }}-${{ github.event_name == 'pull_request' && 'pr' || 'full' }}-${{ hashFiles('cmd/ios-app/project.yml') }}-

      - name: Run iOS Tests
        env:
          TMPDIR: /tmp
          PWUSAGE_DERIVED_DATA: /tmp/pwusage-derived-data
          # 20 minutes accommodates optimized build time variance under macos-15 runner load.
          PWUSAGE_TEST_TIMEOUT_SECONDS: 1200
          # The simulator boots before the timed run. Cold boots on a busy runner have taken over
          # ten minutes, which used to come out of the 20 above and time out main's full suite.
          PWUSAGE_SIMULATOR_BOOT_TIMEOUT_SECONDS: 900
          # Pushes to main and manual workflow dispatch force the full -O suite.
          # Pull requests use change detection via --auto.
          PWUSAGE_DETECTOR_PARITY: ${{ github.event_name != 'pull_request' && '1' || '' }}
        # --auto: promotes to --full (-O + year fixtures) on detector changes; runs default fast suite otherwise.
        run: ./run-tests.sh --auto

      - name: Save build products
        uses: actions/cache/save@v6.1.0
        with:
          path: /tmp/pwusage-derived-data
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      # A pull request can only restore caches saved on its own branch or on main, and main builds
      # optimized. Without a Debug cache from main, the first run of every new pull request rebuilds
      # everything. Replace the optimized products with a Debug build and save it under the
      # pull-request key, starting from the last one main saved.
      - name: Clear optimized build products
        if: github.event_name != 'pull_request'
        run: rm -rf /tmp/pwusage-derived-data

      - name: Restore Debug build products for pull requests
        if: github.event_name != 'pull_request'
        id: pr-build-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: /tmp/pwusage-derived-data
          key: ios-derived-data-${{ runner.os }}-pr-${{ hashFiles('cmd/ios-app/project.yml') }}-${{ github.sha }}
          restore-keys: |
            ios-derived-data-${{ runner.os }}-pr-${{ hashFiles('cmd/ios-app/project.yml') }}-

      - name: Build Debug tests for pull requests
        if: github.event_name != 'pull_request'
        env:
          TMPDIR: /tmp
          PWUSAGE_DERIVED_DATA: /tmp/pwusage-derived-data
          PWUSAGE_TEST_TIMEOUT_SECONDS: 1200
        run: ./run-tests.sh --build-only

      - name: Save Debug build products for pull requests
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6.1.0
        with:
          path: /tmp/pwusage-derived-data
          key: ${{ steps.pr-build-cache.outputs.cache-primary-key }}

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-test-artifacts
          # Only the result bundle (with on-failure diagnostics); DerivedData is gigabytes.
          path: /tmp/pwusage-ios-tests.*/**/TestResults.xcresult
          if-no-files-found: ignore
