name: iOS CI

run-name: ${{ github.event_name == 'pull_request' && format('👀 {0}', github.event.pull_request.title) || github.event_name == 'push' && format('⛵ {0}', github.event.head_commit.message) || github.ref_name }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'cmd/ios-app/**'
      - '.swiftlint.yml'
      - '.swiftlint-baseline.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

# New PR updates (including a return to draft) supersede older test runs.
# Manual runs have independent groups and are never canceled by PR activity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run iOS Tests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    # GitHub-hosted only. A self-hosted runner would execute fork PR code on a
    # personal machine once the repository is public.
    runs-on: macos-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./cmd/ios-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi

      # Existing violations are recorded in the baseline. New violations fail
      # the build until the baseline is burned down (CODE_AUDIT.md §14.4).
      - name: SwiftLint
        working-directory: .
        env:
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          SWIFTLINT_DIR="${RUNNER_TEMP:-/tmp}/swiftlint-${SWIFTLINT_VERSION}"
          if [[ ! -x "${SWIFTLINT_DIR}/swiftlint" ]]; then
            mkdir -p "${SWIFTLINT_DIR}"
            curl --retry 3 --retry-delay 5 --connect-timeout 20 -fsSL \
              -o "${SWIFTLINT_DIR}.zip" \
              "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
            echo "${SWIFTLINT_SHA256}  ${SWIFTLINT_DIR}.zip" | shasum -a 256 -c -
            unzip -q "${SWIFTLINT_DIR}.zip" -d "${SWIFTLINT_DIR}"
          fi
          "${SWIFTLINT_DIR}/swiftlint" version
          "${SWIFTLINT_DIR}/swiftlint" lint \
            --strict \
            --quiet \
            --baseline .swiftlint-baseline.json \
            --reporter github-actions-logging

      - name: Run iOS Tests
        env:
          TMPDIR: /tmp
        run: ./run-tests.sh

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-test-artifacts
          # Only the result bundle (with on-failure diagnostics); DerivedData is gigabytes.
          path: /tmp/pwusage-ios-tests.*/**/TestResults.xcresult
          if-no-files-found: ignore
