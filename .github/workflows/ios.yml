name: iOS CI

run-name: ${{ github.event_name == 'pull_request' && format('👀 {0}', github.event.pull_request.title) || github.event_name == 'push' && format('⛵ {0}', github.event.head_commit.message) || github.ref_name }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'cmd/ios-app/**'
      - '.swiftformat'
      - 'cmd/ios-app/format.sh'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

# New PR updates (including a return to draft) supersede older test runs.
# Manual runs have independent groups and are never canceled by PR activity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run iOS Tests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    # GitHub-hosted only. A self-hosted runner would execute fork PR code on a
    # personal machine once the repository is public.
    runs-on: macos-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./cmd/ios-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi

      - name: SwiftFormat
        working-directory: .
        run: |
          if ! command -v swiftformat &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install swiftformat
          fi
          swiftformat --lint cmd/ios-app --config .swiftformat

      - name: SwiftLint
        working-directory: .
        run: |
          if ! command -v swiftlint &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install swiftlint
          fi
          swiftlint lint cmd/ios-app --strict --baseline .swiftlint-baseline.json --reporter github-actions-logging

      - name: Run iOS Tests
        env:
          TMPDIR: /tmp
        run: ./run-tests.sh

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-test-artifacts
          # Only the result bundle (with on-failure diagnostics); DerivedData is gigabytes.
          path: /tmp/pwusage-ios-tests.*/**/TestResults.xcresult
          if-no-files-found: ignore
