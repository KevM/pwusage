name: iOS CI

run-name: ${{ github.event_name == 'pull_request' && format('👀 {0}', github.event.pull_request.title) || github.event_name == 'push' && format('⛵ {0}', github.event.head_commit.message) || github.ref_name }}

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/ios-app/**'
      - '.swiftformat'
      - '.swiftlint.yml'
      - '.github/workflows/ios.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'cmd/ios-app/**'
      - '.swiftformat'
      - '.swiftlint.yml'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

# New PR updates (including a return to draft) supersede older test runs.
# Manual runs have independent groups and are never canceled by PR activity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-tests:
    name: Run Core Package Tests (macOS)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./cmd/ios-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Cache PWUsageCore build
        uses: actions/cache@v6.1.0
        with:
          path: cmd/ios-app/Packages/PWUsageCore/.build
          key: ios-core-build-${{ runner.os }}-${{ hashFiles('cmd/ios-app/Packages/PWUsageCore/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ios-core-build-${{ runner.os }}-${{ hashFiles('cmd/ios-app/Packages/PWUsageCore/Package.swift') }}-

      - name: Run PWUsageCore Tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mode="--release"
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            mode="--full"
          elif git diff --name-only "origin/${BASE_REF}...HEAD" -- \
            Packages/PWUsageCore/Sources/PWUsageCore/SolarLayout \
            Packages/PWUsageCore/Tests/PWUsageCoreTests/Fixtures/SolarLayout \
            | grep -q .; then
            mode="--full"
          fi
          ./run-core-tests.sh "$mode"

  test:
    name: Run iOS Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # GitHub-hosted only. A self-hosted runner would execute fork PR code on a
    # personal machine once the repository is public.
    # The macos-26 arm64 pool is failing hosted-runner acquisition (community
    # discussion #211885); macos-15 has a separate pool and Xcode 26.3.
    # TODO: return to macos-latest once the arm64 pool recovers.
    runs-on: macos-15
    # The hosted macOS pool can queue longer than the tests themselves; keep the job
    # alive for that wait. run-tests.sh still enforces its own limits: 15 minutes to boot the
    # simulator (in parallel with the build) and 30 for the build and tests together.
    # A job the pool never picks up is retried by ios-runner-retry.yml.
    timeout-minutes: 60

    defaults:
      run:
        working-directory: ./cmd/ios-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Fetch full history so detector_changed can find the merge base with origin/main.
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi

      - name: Lint (SwiftFormat + SwiftLint)
        working-directory: .
        run: |
          for tool in swiftformat swiftlint; do
            if ! command -v "$tool" &> /dev/null; then
              HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install "$tool"
            fi
          done
          # Same command agents run locally; it switches to the GitHub reporter under Actions.
          ./cmd/ios-app/lint.sh

      - name: Test runner checks
        run: ./test-run-tests.sh

      # A fresh checkout stamps every file with the checkout time, so Xcode would rebuild everything.
      # Giving each file its last commit time lets the cached build products below stay valid.
      - name: Restore source file times
        working-directory: .
        run: python3 cmd/ios-app/restore-git-mtimes.py cmd/ios-app

      # Heavy compute/parity suites run in core-tests, so both main and PRs run the same Debug
      # simulator suite and share one Debug DerivedData cache.
      - name: Restore build products
        id: build-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: /tmp/pwusage-derived-data
          key: ios-derived-data-${{ runner.os }}-debug-${{ hashFiles('cmd/ios-app/project.yml') }}-${{ github.sha }}
          restore-keys: |
            ios-derived-data-${{ runner.os }}-debug-${{ hashFiles('cmd/ios-app/project.yml') }}-

      - name: Run iOS Tests
        env:
          TMPDIR: /tmp
          PWUSAGE_DERIVED_DATA: /tmp/pwusage-derived-data
          PWUSAGE_TEST_TIMEOUT_SECONDS: 1800
          # The simulator boots while the tests build, under this separate limit. Cold boots on a
          # busy runner have taken over ten minutes.
          PWUSAGE_SIMULATOR_BOOT_TIMEOUT_SECONDS: 900
        run: ./run-tests.sh

      - name: Save build products
        uses: actions/cache/save@v6.1.0
        with:
          path: /tmp/pwusage-derived-data
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-test-artifacts
          # Only the result bundle (with on-failure diagnostics); DerivedData is gigabytes.
          path: /tmp/pwusage-ios-tests.*/**/TestResults.xcresult
          if-no-files-found: ignore
