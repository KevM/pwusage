name: iOS Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    name: Capture App Store screenshots
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cmd/ios-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Check iPhone Duo support
        run: |
          if ! xcrun simctl list devicetypes | grep -q "iPhone Duo"; then
            echo "::error::This runner's Xcode has no iPhone Duo device type; Xcode 27.1 or later is required."
            exit 1
          fi

      - name: Install XcodeGen and baguette
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen baguette

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: cmd/ios-app

      - name: Capture screenshots
        env:
          TMPDIR: /tmp
        run: bundle exec fastlane ios screenshots

      - name: Retain screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-screenshots
          path: cmd/ios-app/fastlane/screenshots/
          if-no-files-found: ignore

      - name: Install asc
        run: HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install asc

      - name: Upload screenshots to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_BYPASS_KEYCHAIN: '1'
        run: |
          set -euo pipefail
          app_id=$(asc apps list --bundle-id fm.rodeo.pwusage --output json | jq -er '.data | if length == 1 then .[0].id else error("Expected exactly one PWUsage app") end')
          version=$(ruby -ryaml -e 'puts YAML.load_file("project.yml").fetch("settings").fetch("base").fetch("MARKETING_VERSION")')
          shots=fastlane/screenshots/en-US
          test -d "$shots"
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          while IFS='|' read -r device_type prefix expected; do
            mkdir "$staging/$device_type"
            find "$shots" -maxdepth 1 -name "$prefix*.png" -exec cp {} "$staging/$device_type/" \;
            count=$(find "$staging/$device_type" -name '*.png' | wc -l | tr -d ' ')
            if [ "$count" -ne "$expected" ]; then
              echo "::error::Expected $expected $device_type screenshots, found $count"
              exit 1
            fi
            asc screenshots validate --path "$staging/$device_type" --device-type "$device_type" --output json
          done <<'SCREENSHOT_SETS'
          IPHONE_69|iPhone 18 Pro Max-|6
          IPHONE_DUO|iPhone Duo-|5
          IPAD_PRO_3GEN_129|iPad Pro 13-inch (M5)-|5
          SCREENSHOT_SETS
          for device_type in IPHONE_69 IPHONE_DUO IPAD_PRO_3GEN_129; do
            asc screenshots upload \
              --app "$app_id" \
              --version "$version" \
              --locale en-US \
              --path "$staging/$device_type" \
              --device-type "$device_type" \
              --replace --confirm \
              --output json
          done
