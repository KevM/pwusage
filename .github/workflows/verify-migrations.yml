name: Verify Migrations

on:
  pull_request:
    paths:
      - 'cmd/next-app/db-migrations/**'

jobs:
  verify-migration:
    name: Verify Migrations (Prod -> Dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cmd/next-app
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 Client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH
       
      - name: Cache Supabase Docker Image
        id: cache-docker
        uses: actions/cache@v3
        with:
          path: ~/supabase-docker-images.tar
          key: supabase-docker-images-${{ runner.os }}

      - name: Load Cached Docker Image
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          docker load -i ~/supabase-docker-images.tar || echo "Failed to load docker cache, proceeding..."

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump Production DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Dump Schema
          supabase db dump --db-url "$DATABASE_URL" -f schema.sql
          # Dump Data
          supabase db dump --db-url "$DATABASE_URL" -f data.sql --data-only --use-copy
          
          # Clean DB URL for pg_dump (strip pgbouncer param) using Node for safety
          CLEAN_DB_URL=$(node -e 'try { const u = new URL(process.env.DATABASE_URL); u.searchParams.delete("pgbouncer"); console.log(u.toString()); } catch (e) { console.error(e); process.exit(1); }')
          
          # Dump Migration History (to ensure Dev "knows" what Prod has already run)
          pg_dump "$CLEAN_DB_URL" --data-only --table supabase_migrations.schema_migrations > migration_history.sql

      - name: Save Docker Image to Cache
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          # Capture the pulled image (assuming it's the only supabase/postgres one)
          IMAGE_ID=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "supabase/postgres" | head -n 1)
          if [ -n "$IMAGE_ID" ]; then
            echo "Saving image $IMAGE_ID to cache..."
            docker save "$IMAGE_ID" -o ~/supabase-docker-images.tar
          else
            echo "No supabase/postgres image found to cache."
          fi

      - name: Restore to Dev DB
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          # Reset Dev DB public schema
          psql "$DEV_DATABASE_URL" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO postgres; GRANT ALL ON SCHEMA public TO public;"
          
          # Restore Schema
          psql "$DEV_DATABASE_URL" -f schema.sql
          
          # Restore Data
          psql "$DEV_DATABASE_URL" -f data.sql
          
          # Restore Migration History
          # (We truncate first to remove any stale Dev history, then apply Prod's history)
          psql "$DEV_DATABASE_URL" -c "TRUNCATE supabase_migrations.schema_migrations"
          psql "$DEV_DATABASE_URL" -f migration_history.sql

      - name: Prepare Local Migrations
        run: |
          if [ -d "db-migrations" ]; then
            echo "Found db-migrations folder. Moving to supabase/migrations..."
            mkdir -p supabase/migrations
            cp db-migrations/*.sql supabase/migrations/ 2>/dev/null || :
          else
            echo "No db-migrations folder found. Skipping migration copy."
          fi

      - name: Run Migrations on Dev
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          supabase migration up --db-url "$DEV_DATABASE_URL"
