name: Restore Reserve Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  ping-cron:
    name: Ping Restore Reserve Cron
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Restore Reserve
        env:
          APP_URL: 'https://pwusage.fm.rodeo'
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -f -s -X GET "${APP_URL}/api/cron/restore-reserve" \
            -H "Authorization: Bearer ${CRON_SECRET}"
