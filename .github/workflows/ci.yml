name: CI
run-name: ${{ github.event_name == 'pull_request' && format('👀 {0}', github.event.pull_request.title) || github.event_name == 'push' && format('⛵ {0}', github.event.head_commit.message) || github.ref_name }}

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'cmd/ios-app/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths-ignore:
      - 'cmd/ios-app/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Cancel obsolete PR checks without interrupting production migrations/deploys.
# Non-PR runs have independent groups, so queued production runs also survive.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cmd/next-app
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./cmd/next-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Install PostgreSQL 17 for synthetic archive tests
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17
      - name: Run all tests including lossless archive and recovery checks
        env:
          COMPACT_HISTORY_PG_BIN: /usr/lib/postgresql/17/bin
        run: npm run test:compact
      - name: Test battery hold claims against isolated PostgreSQL
        env:
          BATTERY_HOLD_PG_BIN: /usr/lib/postgresql/17/bin
        run: npm run test:hold:postgres
      - name: Test backup restore against isolated PostgreSQL
        env:
          DB_BACKUP_PG_BIN: /usr/lib/postgresql/17/bin
        run: npm run test:backup:postgres
      - name: Test dev-copy guard, sanitize and prune against isolated PostgreSQL
        env:
          DEV_COPY_PG_BIN: /usr/lib/postgresql/17/bin
        run: npm run test:dev-copy:postgres

  build:
    name: Build App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cmd/next-app
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./cmd/next-app/package-lock.json
      - run: npm ci
      - run: npm run build

  backup:
    name: Backup Database
    if: github.ref == 'refs/heads/main' && needs.check-db-changes.outputs.migrations == 'true'
    needs: [test, build, check-db-changes]
    uses: ./.github/workflows/db-backup.yml
    with:
      kind: pre-migration
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_READ_WRITE_TOKEN }}

  migrate:
    name: Run Migrations
    if: github.ref == 'refs/heads/main' && needs.check-db-changes.outputs.migrations == 'true'
    needs: [backup, check-db-changes]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cmd/next-app
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: latest
      
      - name: Prepare Migrations
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BATTERY_RESTORE_CRON_TARGET_URL: "https://pwusage.fm.rodeo/api/cron/restore-reserve"
        run: |
          if [ -d "db-migrations" ]; then
            echo "Found db-migrations folder. Moving to supabase/migrations..."
            mkdir -p supabase/migrations
            cp db-migrations/*.sql supabase/migrations/ 2>/dev/null || :
            node -e "
              const fs = require('fs');
              const path = require('path');
              const files = fs.readdirSync('supabase/migrations').filter(f => f.endsWith('.sql'));
              files.forEach(file => {
                const filepath = path.join('supabase/migrations', file);
                let content = fs.readFileSync(filepath, 'utf8');
                if (process.env.CRON_SECRET) {
                  content = content.split('{{CRON_SECRET}}').join(process.env.CRON_SECRET);
                }
                if (process.env.BATTERY_RESTORE_CRON_TARGET_URL) {
                  content = content.split('{{BATTERY_RESTORE_CRON_TARGET_URL}}').join(process.env.BATTERY_RESTORE_CRON_TARGET_URL);
                }
                fs.writeFileSync(filepath, content, 'utf8');
              });
            "
          else
            echo "No db-migrations folder found. Skipping migration copy."
          fi

      - name: Run Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          MIGRATION_DB_URL=$(echo "$DATABASE_URL" | sed 's/:6543/:5432/')
          supabase migration up --db-url "$MIGRATION_DB_URL"

  deploy:
    name: Deploy to Vercel
    if: |
      github.ref == 'refs/heads/main' &&
      always() &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    needs: [test, build, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          vercel-version: 'latest'

  check-db-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            migrations:
              - 'cmd/next-app/db-migrations/**'
              - 'cmd/next-app/supabase/migrations/**'

  verify-db:
    name: Verify Migrations (Prod -> Dev)
    needs: [test, build, check-db-changes]
    # Fork PRs get no secrets; skip rather than fail against an empty DB URL.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.check-db-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cmd/next-app
    steps:
      - uses: actions/checkout@v7.0.1
      
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: latest

      # Before any SQL: the dev-only steps below drop and rewrite the target.
      - name: Check dev and prod databases differ
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: bash scripts/check-dev-database-url.sh

      - name: Dump Production DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Dump Schema
          supabase db dump --db-url "$DATABASE_URL" -f schema.sql
          # Only public is reset below. Managed auth/storage data can include
          # protected tables (e.g. storage.buckets_vectors) we cannot restore.
          supabase db dump --db-url "$DATABASE_URL" -f data.sql --data-only --use-copy --schema public
          
          # Dump Migration History (using Supabase CLI for reliability)
          # We use "|| true" to prevent failure if the schema doesn't exist yet (soft fail)
          supabase db dump --db-url "$DATABASE_URL" --data-only --schema supabase_migrations > migration_history.sql || echo "Warning: Failed to dump migration history. Proceeding with empty history."
          
          # Ensure file exists even if dump failed
          if [ ! -s migration_history.sql ]; then
            touch migration_history.sql
          fi

      - name: Restore to Dev DB
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          # Refuse unless the target carries the dev marker (docs/database-backups.md).
          # Must stay the first command: everything below drops or rewrites data.
          psql -X -v ON_ERROR_STOP=1 "$DEV_DATABASE_URL" -f scripts/assert-dev-database.sql

          # Reset Dev DB public schema
          psql "$DEV_DATABASE_URL" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO postgres; GRANT ALL ON SCHEMA public TO public;"
          
          # Restore Schema
          psql "$DEV_DATABASE_URL" -f schema.sql
          
          # Restore Data and scrub it in one transaction, so beta and the dev
          # pg_cron jobs never see unscrubbed rows. Any error rolls back both.
          psql -X --single-transaction -v ON_ERROR_STOP=1 "$DEV_DATABASE_URL" -f data.sql -f scripts/sanitize-dev-copy.sql
          
          # Restore Migration History
          # (We truncate first to remove any stale Dev history, then apply Prod's history)
          psql "$DEV_DATABASE_URL" -c "TRUNCATE supabase_migrations.schema_migrations"
          psql "$DEV_DATABASE_URL" -f migration_history.sql

      - name: Prepare Local Migrations
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BATTERY_RESTORE_CRON_TARGET_URL: "https://pwusagebeta.fm.rodeo/api/cron/restore-reserve"
        run: |
          if [ -d "db-migrations" ]; then
            echo "Found db-migrations folder. Moving to supabase/migrations..."
            mkdir -p supabase/migrations
            cp db-migrations/*.sql supabase/migrations/ 2>/dev/null || :
            node -e "
              const fs = require('fs');
              const path = require('path');
              const files = fs.readdirSync('supabase/migrations').filter(f => f.endsWith('.sql'));
              files.forEach(file => {
                const filepath = path.join('supabase/migrations', file);
                let content = fs.readFileSync(filepath, 'utf8');
                if (process.env.CRON_SECRET) {
                  content = content.split('{{CRON_SECRET}}').join(process.env.CRON_SECRET);
                }
                if (process.env.BATTERY_RESTORE_CRON_TARGET_URL) {
                  content = content.split('{{BATTERY_RESTORE_CRON_TARGET_URL}}').join(process.env.BATTERY_RESTORE_CRON_TARGET_URL);
                }
                fs.writeFileSync(filepath, content, 'utf8');
              });
            "
          else
            echo "No db-migrations folder found. Skipping migration copy."
          fi

      - name: Run Migrations on Dev
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          MIGRATION_DB_URL=$(echo "$DEV_DATABASE_URL" | sed 's/:6543/:5432/')
          supabase migration up --db-url "$MIGRATION_DB_URL"

      # After migrations were verified on full prod-sized data: shrink the copy.
      - name: Prune Dev Copy
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          # Session mode (:5432), as for migrations, for the long-running VACUUM FULL.
          PRUNE_DB_URL=$(echo "$DEV_DATABASE_URL" | sed 's/:6543/:5432/')
          psql -X -v ON_ERROR_STOP=1 "$PRUNE_DB_URL" -f scripts/prune-dev-copy.sql

  deploy-preview:
    name: Deploy to Vercel (Preview)
    needs: [test, build, verify-db]
    if: |
      github.event_name == 'pull_request' && 
      github.event.pull_request.head.repo.full_name == github.repository &&
      always() && 
      needs.test.result == 'success' && 
      needs.build.result == 'success' && 
      (needs.verify-db.result == 'success' || needs.verify-db.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Deploy to Vercel
        id: deploy_preview
        uses: amondnet/vercel-action@v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-version: 'latest'
          vercel-args: '--env DATABASE_URL=${{ secrets.DEV_DATABASE_URL }} --build-env DATABASE_URL=${{ secrets.DEV_DATABASE_URL }} --env NEXT_PUBLIC_APP_URL=https://pwusagebeta.fm.rodeo --build-env NEXT_PUBLIC_APP_URL=https://pwusagebeta.fm.rodeo'
      # Keep preview-url as the deployment URL; the action swallows alias errors.
      - name: Assign beta hostname
        env:
          DEPLOYMENT_URL: ${{ steps.deploy_preview.outputs.preview-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Vercel did not return a deployment URL"
            exit 1
          fi
          npx --yes vercel@latest alias set "$DEPLOYMENT_URL" pwusagebeta.fm.rodeo \
            --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

  notify:
    name: Discord Notification
    needs: deploy
    if: always() && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR Description
        id: pr_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch PR body associated with the merged commit
          PR_JSON=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0] | {body: .body, html_url: .html_url}' || echo "null")
          PR_BODY=$(echo "$PR_JSON" | jq -r '.body // "No description provided."')
          PR_URL=$(echo "$PR_JSON" | jq -r '.html_url // ""')
          
          # Extract first image URL: ![alt](url)
          IMG_URL=$(echo "$PR_BODY" | grep -oE '!\[[^]]*\]\(https?://[^)]+\)' | head -n 1 | sed -E 's/!\[.*\]\((.*)\)/\1/' || echo "")
          
          # Clean body (strip images, truncate to 1000 chars)
          CLEAN_BODY=$(echo "$PR_BODY" | sed -E 's/!\[[^]]*\]\(https?://[^)]+\)//g' | tr -s '\n' | head -c 1000)
          
          echo "PR_BODY<<EOF" >> $GITHUB_ENV
          echo "$CLEAN_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          echo "IMG_URL=$IMG_URL" >> $GITHUB_ENV
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

      - name: Send Discord Webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_BODY: ${{ env.PR_BODY }}
          IMG_URL: ${{ env.IMG_URL }}
          PR_URL: ${{ env.PR_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Use jq to safely construct the JSON
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg commit "$COMMIT_MSG" \
            --arg body "$PR_BODY" \
            --arg img "$IMG_URL" \
            --arg url "$PR_URL" \
            '{
              embeds: [{
                title: "Success: Production Deploy",
                url: $url,
                color: 3066993,
                fields: [
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Author", value: $actor, inline: true },
                  { name: "Commit", value: ($commit | if . == "" then "N/A" else . end), inline: false },
                  { name: "Description", value: (if $body == "" then "No description provided." else $body end), inline: false }
                ],
                image: (if $img != "" then { url: $img } else null end),
                footer: { text: "Powered by GitHub Actions" }
              }]
            }' > discord_payload.json

          curl -H "Content-Type: application/json" \
               -d @discord_payload.json \
               "$DISCORD_WEBHOOK"
