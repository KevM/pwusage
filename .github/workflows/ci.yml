name: CI
run-name: ${{ github.event_name == 'push' && 'Production Deploy' || 'Preview Deploy' }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cmd/next-app
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./cmd/next-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    name: Build App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cmd/next-app
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./cmd/next-app/package-lock.json
      - run: npm ci
      - run: npm run build

  backup:
    name: Backup Database
    if: github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./cmd/next-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create DB Backup
        id: create_backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          # Dump Roles
          supabase db dump --db-url "$DATABASE_URL" -f roles.sql --role-only
          # Dump Schema
          supabase db dump --db-url "$DATABASE_URL" -f schema.sql
          # Dump Data
          supabase db dump --db-url "$DATABASE_URL" -f data.sql --data-only --use-copy
          
          # Zip files
          ZIP_FILENAME="backup-${TIMESTAMP}.zip"
          zip -q "${ZIP_FILENAME}" roles.sql schema.sql data.sql
          
          echo "filename=${ZIP_FILENAME}" >> $GITHUB_OUTPUT

      - name: Upload to Vercel Blob
        uses: dartilesm/vercel-blob-action@v2
        with:
          source: "./cmd/next-app/${{ steps.create_backup.outputs.filename }}"
          destination: "db-backup/${{ steps.create_backup.outputs.filename }}"
          read-write-token: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

  migrate:
    name: Run Migrations
    if: github.ref == 'refs/heads/main'
    needs: backup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cmd/next-app
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      
      - name: Prepare Migrations
        run: |
          if [ -d "db-migrations" ]; then
            echo "Found db-migrations folder. Moving to supabase/migrations..."
            mkdir -p supabase/migrations
            cp db-migrations/*.sql supabase/migrations/ 2>/dev/null || :
          else
            echo "No db-migrations folder found. Skipping migration copy."
          fi

      - name: Run Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          supabase migration up --db-url "$DATABASE_URL"

  deploy:
    name: Deploy to Vercel
    if: github.ref == 'refs/heads/main'
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          vercel-version: 'latest'

  verify-db:
    name: Verify Migrations (Prod -> Dev)
    needs: [test, build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cmd/next-app
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump Production DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Dump Schema
          supabase db dump --db-url "$DATABASE_URL" -f schema.sql
          # Dump Data
          supabase db dump --db-url "$DATABASE_URL" -f data.sql --data-only --use-copy
          
          # Dump Migration History (using Supabase CLI for reliability)
          # We use "|| true" to prevent failure if the schema doesn't exist yet (soft fail)
          supabase db dump --db-url "$DATABASE_URL" --data-only --schema supabase_migrations > migration_history.sql || echo "Warning: Failed to dump migration history. Proceeding with empty history."
          
          # Ensure file exists even if dump failed
          if [ ! -s migration_history.sql ]; then
            touch migration_history.sql
          fi

      - name: Restore to Dev DB
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          # Reset Dev DB public schema
          psql "$DEV_DATABASE_URL" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO postgres; GRANT ALL ON SCHEMA public TO public;"
          
          # Restore Schema
          psql "$DEV_DATABASE_URL" -f schema.sql
          
          # Restore Data
          psql "$DEV_DATABASE_URL" -f data.sql
          
          # Restore Migration History
          # (We truncate first to remove any stale Dev history, then apply Prod's history)
          psql "$DEV_DATABASE_URL" -c "TRUNCATE supabase_migrations.schema_migrations"
          psql "$DEV_DATABASE_URL" -f migration_history.sql

      - name: Prepare Local Migrations
        run: |
          if [ -d "db-migrations" ]; then
            echo "Found db-migrations folder. Moving to supabase/migrations..."
            mkdir -p supabase/migrations
            cp db-migrations/*.sql supabase/migrations/ 2>/dev/null || :
          else
            echo "No db-migrations folder found. Skipping migration copy."
          fi

      - name: Run Migrations on Dev
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          supabase migration up --db-url "$DEV_DATABASE_URL"

  deploy-preview:
    name: Deploy to Vercel (Preview)
    needs: [test, build, verify-db]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-version: 'latest'
          vercel-args: '--env DATABASE_URL=${{ secrets.DEV_DATABASE_URL }} --build-env DATABASE_URL=${{ secrets.DEV_DATABASE_URL }} --env NEXT_PUBLIC_APP_URL=https://pwusagebeta.fm.rodeo --build-env NEXT_PUBLIC_APP_URL=https://pwusagebeta.fm.rodeo'
          alias-domains: 'pwusagebeta.fm.rodeo'

