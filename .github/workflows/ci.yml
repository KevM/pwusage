name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cmd/next-app
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./cmd/next-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    name: Build App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cmd/next-app
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./cmd/next-app/package-lock.json
      - run: npm ci
      - run: npm run build

  backup:
    name: Backup Database
    needs: [test, build]
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./cmd/next-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create DB Backup
        id: create_backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          # Dump Roles
          supabase db dump --db-url "$DATABASE_URL" -f roles.sql --role-only
          # Dump Schema
          supabase db dump --db-url "$DATABASE_URL" -f schema.sql
          # Dump Data
          supabase db dump --db-url "$DATABASE_URL" -f data.sql --data-only --use-copy
          
          # Zip files
          ZIP_FILENAME="backup-${TIMESTAMP}.zip"
          zip -q "${ZIP_FILENAME}" roles.sql schema.sql data.sql
          
          echo "filename=${ZIP_FILENAME}" >> $GITHUB_OUTPUT

      - name: Upload to Vercel Blob
        uses: dartilesm/vercel-blob-action@v2
        with:
          source: "./cmd/next-app/${{ steps.create_backup.outputs.filename }}"
          destination: "db-backup/${{ steps.create_backup.outputs.filename }}"
          read-write-token: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

  migrate:
    name: Run Migrations
    needs: backup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cmd/next-app
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      
      - name: Prepare Migrations
        run: |
          if [ -d "db-migrations" ]; then
            echo "Found db-migrations folder. Moving to supabase/migrations..."
            mkdir -p supabase/migrations
            cp db-migrations/*.sql supabase/migrations/ 2>/dev/null || :
          else
            echo "No db-migrations folder found. Skipping migration copy."
          fi

      - name: Run Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          supabase migration up --db-url "$DATABASE_URL"

  deploy:
    name: Deploy to Vercel
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          vercel-version: 'latest'

