name: Database Backup
run-name: Database backup (${{ inputs.kind || (github.event.schedule == '41 9 * * 0' && 'weekly') || 'daily' }})

# Private production backups. Kinds, folders and retention live in
# cmd/next-app/scripts/db-backup-kinds.ts; restore steps in docs/database-backups.md.
# A daily dump is about 3 MB and a full one about 67 MB of Supabase egress
# (Free plan: 5 GB a month, shared with the app), measured 2026-10-15.
on:
  schedule:
    - cron: '23 9 * * *'  # daily: every table except EnergyData history
    - cron: '41 9 * * 0'  # weekly, Sunday: complete
  workflow_dispatch:
    inputs:
      kind:
        description: Backup kind
        type: choice
        options: [daily, weekly]
        default: daily
  workflow_call:
    inputs:
      kind:
        type: string
        required: true
    secrets:
      DATABASE_URL:
        required: true
      BACKUP_BLOB_READ_WRITE_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  backup:
    name: Back up database
    runs-on: ubuntu-latest
    env:
      BACKUP_KIND: ${{ inputs.kind || (github.event.schedule == '41 9 * * 0' && 'weekly') || 'daily' }}
    concurrency:
      group: db-backup-${{ inputs.kind || (github.event.schedule == '41 9 * * 0' && 'weekly') || 'daily' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ./cmd/next-app
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: latest

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cmd/next-app/package-lock.json

      - run: npm ci

      - name: Check private backup credentials
        env:
          BACKUP_BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BACKUP_BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::Configure BACKUP_BLOB_READ_WRITE_TOKEN for a private Vercel Blob store."
            exit 1
          fi

      - name: Dump and verify
        id: dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          bash scripts/dump-db-backup.sh "$BACKUP_KIND" backup
          ZIP_FILENAME="backup-${BACKUP_KIND}-$(date -u +%Y-%m-%d_%H-%M-%S).zip"
          zip -q -j "$ZIP_FILENAME" backup/*
          ls -l backup "$ZIP_FILENAME"
          echo "filename=${ZIP_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Upload private backup
        env:
          BACKUP_BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_READ_WRITE_TOKEN }}
          BACKUP_FILENAME: ${{ steps.dump.outputs.filename }}
        run: npx tsx scripts/upload-db-backup.ts "$BACKUP_FILENAME" "$BACKUP_KIND"

      # Runs only after a verified upload; the script also refuses unless the
      # folder's newest backup is fresh, so old backups survive a failed run.
      - name: Remove backups past retention
        env:
          BACKUP_BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_READ_WRITE_TOKEN }}
        run: npx tsx scripts/db-backup-retention.ts "$BACKUP_KIND"
