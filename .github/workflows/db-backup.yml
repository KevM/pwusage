name: Database Backup
run-name: Encrypted export of existing backup for local restore validation
on:
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [daily]
        default: daily
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd/next-app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cmd/next-app/package-lock.json
      - run: npm ci
      - name: Read existing private backup and encrypt for rehearsal machine
        env:
          BACKUP_BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_READ_WRITE_TOKEN }}
        run: node scripts/export-backup-rehearsal.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-backup-rehearsal
          path: |
            cmd/next-app/backup-rehearsal.enc
            cmd/next-app/backup-rehearsal-envelope.json
          retention-days: 1
          if-no-files-found: error
