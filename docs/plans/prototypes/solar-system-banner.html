<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar System banner prototype</title>
<!--
Design reference for docs/plans/2026-11-02-solar-system-experience.md (Experience 5, Task 7).
Top: expanded placement above the tab bar. Bottom: inline placement.
Not yet reflected here (decided after this prototype): dots use the strip's colors (grey until sorted, then
blue cloudy / amber clear, dashed ring for no production), and the no-location state (pin + "Add your location
to find your solar system").
-->
<style>
:root{--surface-1:#f5f4f0;--surface-2:#fff;--border:rgba(11,11,11,.1);--border-strong:rgba(11,11,11,.18);--border-stronger:rgba(11,11,11,.4);--text-primary:#0b0b0b;--text-secondary:#52514e;--accent:#2a78d6}
@media (prefers-color-scheme:dark){:root{--surface-1:#121211;--surface-2:#1f1f1d;--border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.18);--border-stronger:rgba(255,255,255,.4);--text-primary:#f0efec;--text-secondary:#c3c2b7;--accent:#3987e5}}
body{margin:0;background:var(--surface-1);color:var(--text-primary);font:14px -apple-system,system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px}
</style>
</head>
<body>
<div style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px">
<svg id="big" viewBox="0 0 380 56" width="100%" role="img" aria-label="Expanded banner"></svg>
<div style="display:flex;justify-content:space-around;color:var(--text-secondary);font-size:11px;padding:10px 4px;border-radius:24px;background:var(--surface-2);border:.5px solid var(--border)">
<span style="color:var(--accent)">Home</span><span>Bill</span><span>Smart Shift</span><span>Settings</span>
</div>
<svg id="small" viewBox="0 0 200 44" style="max-width:260px" role="img" aria-label="Inline banner"></svg>
</div>
<script>
const NS='http://www.w3.org/2000/svg',rad=d=>d*Math.PI/180,cl=x=>Math.max(0,Math.min(1,x));
const ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
let seed=5;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const AZ=192;let t0=performance.now(),days=[];
function el(svg,tag,a,txt){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt)e.textContent=txt;svg.appendChild(e);return e}
function schedule(){days=[];let t=.3;for(let i=0;i<240;i++){if(i%3===0)t+=1.1;days.push({t:t+(i%3)*.12,clear:rnd()<.24,checkAt:null})}
 for(let i=0;i<days.length;i++){const cp=Math.floor(i/6)*6+5;days[i].checkAt=days[Math.min(days.length-1,cp)].t+.5}}
schedule();
function wedge(n){return 6+150*Math.pow(6/(n+6),1.3)}
function draw(svg,now,mode){
 const t=(now-t0)/1000;svg.innerHTML='';
 const W=mode==='big'?380:200,H=mode==='big'?56:44;
 el(svg,'rect',{x:.5,y:.5,width:W-1,height:H-1,rx:H/2,fill:'var(--surface-2)',stroke:'var(--border)'});
 const cx=H/2+2,cy=H/2,r=mode==='big'?17:13;
 el(svg,'circle',{cx,cy,r,fill:'none',stroke:'var(--border-strong)'});
 const landed=days.filter(d=>d.clear&&t>d.checkAt+.7).length;
 const w=wedge(landed),pts=[[cx,cy]];
 for(let i=0;i<=16;i++){const a=rad(AZ-w/2+w*i/16);pts.push([cx+Math.sin(a)*r,cy-Math.cos(a)*r])}
 if(landed)el(svg,'polygon',{points:pts.map(p=>p.join(',')).join(' '),fill:'#EF9F27','fill-opacity':.55});
 const am=rad(AZ);if(landed)el(svg,'line',{x1:cx,y1:cy,x2:cx+Math.sin(am)*r,y2:cy-Math.cos(am)*r,stroke:'#BA7517','stroke-width':1.5,'stroke-linecap':'round'});
 const trackL=cx+r+10+(mode==='big'?150:0),trackR=W-16,ty=cy;
 if(mode==='big'){
  el(svg,'text',{x:cx+r+12,y:cy-2,'font-size':13,'font-weight':500,fill:'var(--text-primary)'},'Finding your solar system');
  el(svg,'text',{x:cx+r+12,y:cy+14,'font-size':11,fill:'var(--text-secondary)'},days.filter(d=>t>d.t+.9).length+' days');
 }
 for(const d of days){const p=(t-d.t)/.9;if(p<0)continue;
  const x=trackR-(trackR-trackL)*ease(Math.min(1,p));
  if(p<1){el(svg,'circle',{cx:x,cy:ty,r:2.6,fill:'var(--border-stronger)',opacity:cl(p*4)*(1-cl((p-.85)/.15))});continue}
  if(d.clear&&t>d.checkAt){const q=cl((t-d.checkAt)/.7);if(q<1){const e=ease(q),sx=trackL,sy=ty,tx=cx+Math.sin(am)*r,ty2=cy-Math.cos(am)*r,mx=(sx+tx)/2,my=Math.min(sy,ty2)-16;
   el(svg,'circle',{cx:(1-e)*(1-e)*sx+2*(1-e)*e*mx+e*e*tx,cy:(1-e)*(1-e)*sy+2*(1-e)*e*my+e*e*ty2,r:2.8,fill:'#EF9F27'})}}
 }
 if(t>days[days.length-1].checkAt+2){t0=now;schedule()}
}
function loop(now){draw(document.getElementById('big'),now,'big');draw(document.getElementById('small'),now,'small');requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
