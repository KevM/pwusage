name: PWUsage
options:
  bundleIdPrefix: fm.rodeo
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  PWUsage:
    type: application
    platform: iOS
    sources:
      - path: PWUsage
      - path: Shared
    info:
      path: PWUsage/Info.plist
      properties:
        CFBundleDisplayName: pwusage
        PWUSAGE_APP_GROUP: "$(PWUSAGE_APP_GROUP)"
        PWUSAGE_API_ORIGIN: "$(PWUSAGE_API_ORIGIN)"
        # Read at runtime so each Live Activity registration reports the APNs
        # environment its entitlement actually uses.
        PWUSAGE_APS_ENVIRONMENT: "$(PWUSAGE_APS_ENVIRONMENT)"
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportsTrueScreenSizeOnMac: true
        CFBundleURLTypes:
          - CFBundleURLName: fm.rodeo.pwusage
            CFBundleURLSchemes:
              - pwusage
    dependencies:
      - target: PWUsageWidgets
        embed: true
    entitlements:
      path: PWUsage/PWUsage.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(PWUSAGE_APP_GROUP)"
        aps-environment: "$(PWUSAGE_APS_ENVIRONMENT)"
    settings:
      base:
        PWUSAGE_APP_GROUP: group.fm.rodeo.pwusage
        PWUSAGE_APS_ENVIRONMENT: production
        PRODUCT_BUNDLE_IDENTIFIER: fm.rodeo.pwusage
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6HQGHHRK87
      configs:
        Debug:
          PWUSAGE_APP_GROUP: group.fm.rodeo.pwusage.debug
          PWUSAGE_API_ORIGIN: https://pwusagebeta.fm.rodeo
          PWUSAGE_APS_ENVIRONMENT: development
        Release:
          PWUSAGE_API_ORIGIN: https://pwusage.fm.rodeo
  PWUsageWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PWUsageWidgets
      - path: Shared
    info:
      path: PWUsageWidgets/Info.plist
      properties:
        CFBundleDisplayName: Today's Energy
        PWUSAGE_APP_GROUP: "$(PWUSAGE_APP_GROUP)"
        PWUSAGE_API_ORIGIN: "$(PWUSAGE_API_ORIGIN)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PWUsageWidgets/PWUsageWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(PWUSAGE_APP_GROUP)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.rodeo.pwusage.widgets
        DEVELOPMENT_TEAM: 6HQGHHRK87
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        PWUSAGE_APP_GROUP: group.fm.rodeo.pwusage
      configs:
        Debug:
          PWUSAGE_APP_GROUP: group.fm.rodeo.pwusage.debug
          PWUSAGE_API_ORIGIN: https://pwusagebeta.fm.rodeo
        Release:
          PWUSAGE_API_ORIGIN: https://pwusage.fm.rodeo
  PWUsageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PWUsageTests
    info:
      path: PWUsageTests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.rodeo.pwusage.tests
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: PWUsage
schemes:
  PWUsage:
    build:
      targets:
        PWUsage: all
    run:
      debugEnabled: false
    test:
      environmentVariables:
        PWUSAGE_FUZZ_STRESS: "$(PWUSAGE_FUZZ_STRESS)"
        PWUSAGE_FUZZ_SEED: "$(PWUSAGE_FUZZ_SEED)"
      targets:
        - PWUsageTests
