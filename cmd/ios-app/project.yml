name: PWUsage
configs:
  Debug: debug
  DebugOptimized: debug
  Release: release
options:
  bundleIdPrefix: fm.rodeo
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.2"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    DEVELOPMENT_TEAM: 6HQGHHRK87
    # The server a Debug build signs in to; Release always uses Prod. Switch to Beta
    # (https://pwusagebeta.fm.rodeo, the Dev database) when testing unmerged server changes.
    PWUSAGE_DEBUG_API_ORIGIN: https://pwusagebeta.fm.rodeo
targets:
  PWUsage:
    type: application
    platform: iOS
    sources:
      - path: PWUsage
      - path: Shared
    info:
      path: PWUsage/Info.plist
      properties:
        CFBundleDisplayName: pwusage
        PWUSAGE_APP_GROUP: "$(PWUSAGE_APP_GROUP)"
        PWUSAGE_API_ORIGIN: "$(PWUSAGE_API_ORIGIN)"
        # Read at runtime so each Live Activity registration reports the APNs
        # environment its entitlement actually uses.
        PWUSAGE_APS_ENVIRONMENT: "$(PWUSAGE_APS_ENVIRONMENT)"
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - fm.rodeo.pwusage.solar-forecast-refresh
          - fm.rodeo.pwusage.solar-layout-detect
          - fm.rodeo.pwusage.history-onboarding
        UIBackgroundModes:
          - fetch
          - processing
          - remote-notification
        NSLocationWhenInUseUsageDescription: "PWUsage uses your home's approximate location once to work out which way your solar panels face."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportsTrueScreenSizeOnMac: true
        CFBundleURLTypes:
          - CFBundleURLName: fm.rodeo.pwusage
            CFBundleURLSchemes:
              - pwusage
    dependencies:
      - target: PWUsageWidgets
        embed: true
    entitlements:
      path: PWUsage/PWUsage.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(PWUSAGE_APP_GROUP)"
        aps-environment: "$(PWUSAGE_APS_ENVIRONMENT)"
        com.apple.developer.icloud-container-identifiers:
          - iCloud.fm.rodeo.pwusage
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PWUSAGE_APP_GROUP: group.fm.rodeo.pwusage
        PWUSAGE_APS_ENVIRONMENT: production
        PRODUCT_BUNDLE_IDENTIFIER: fm.rodeo.pwusage
        CODE_SIGN_STYLE: Automatic
        # The primary icon is PWUsage/AppIcon.icon. The value has to match that
        # document's basename; XcodeGen supplies the same default, but naming it
        # here keeps the link visible when the icon is moved or renamed.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Emphasis
      configs:
        Debug:
          PWUSAGE_APP_GROUP: group.fm.rodeo.pwusage.debug
          PWUSAGE_API_ORIGIN: $(PWUSAGE_DEBUG_API_ORIGIN)
          PWUSAGE_APS_ENVIRONMENT: development
        DebugOptimized:
          PWUSAGE_APP_GROUP: group.fm.rodeo.pwusage.debug
          PWUSAGE_API_ORIGIN: $(PWUSAGE_DEBUG_API_ORIGIN)
          PWUSAGE_APS_ENVIRONMENT: development
          SWIFT_OPTIMIZATION_LEVEL: "-O"
        Release:
          PWUSAGE_API_ORIGIN: https://pwusage.fm.rodeo
  PWUsageWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PWUsageWidgets
      - path: Shared
    info:
      path: PWUsageWidgets/Info.plist
      properties:
        CFBundleDisplayName: Today's Energy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        PWUSAGE_APP_GROUP: "$(PWUSAGE_APP_GROUP)"
        PWUSAGE_API_ORIGIN: "$(PWUSAGE_API_ORIGIN)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PWUsageWidgets/PWUsageWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(PWUSAGE_APP_GROUP)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.rodeo.pwusage.widgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Emphasis
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        PWUSAGE_APP_GROUP: group.fm.rodeo.pwusage
      configs:
        Debug:
          PWUSAGE_APP_GROUP: group.fm.rodeo.pwusage.debug
          PWUSAGE_API_ORIGIN: $(PWUSAGE_DEBUG_API_ORIGIN)
        DebugOptimized:
          PWUSAGE_APP_GROUP: group.fm.rodeo.pwusage.debug
          PWUSAGE_API_ORIGIN: $(PWUSAGE_DEBUG_API_ORIGIN)
          SWIFT_OPTIMIZATION_LEVEL: "-O"
        Release:
          PWUSAGE_API_ORIGIN: https://pwusage.fm.rodeo
  PWUsageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PWUsageTests
    info:
      path: PWUsageTests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.rodeo.pwusage.tests
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: PWUsage
  # App Store screenshots, driven by `fastlane ios screenshots`. Kept out of the
  # PWUsage scheme so unit test runs and the release never run it.
  PWUsageScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PWUsageScreenshots
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.rodeo.pwusage.screenshots
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: PWUsage
    dependencies:
      - target: PWUsage
schemes:
  PWUsageScreenshots:
    build:
      targets:
        PWUsage: all
        PWUsageScreenshots: [test]
    test:
      config: Debug
      targets:
        - PWUsageScreenshots
  PWUsage:
    build:
      targets:
        PWUsage: all
    run:
      debugEnabled: false
    test:
      environmentVariables:
        PWUSAGE_FUZZ_STRESS: "$(PWUSAGE_FUZZ_STRESS)"
        PWUSAGE_FUZZ_SEED: "$(PWUSAGE_FUZZ_SEED)"
      targets:
        - PWUsageTests
  PWUsageDevOptimized:
    build:
      targets:
        PWUsage: all
    run:
      config: DebugOptimized
      debugEnabled: false
    profile:
      config: DebugOptimized
    analyze:
      config: DebugOptimized
    archive:
      config: DebugOptimized
    test:
      config: DebugOptimized
      environmentVariables:
        PWUSAGE_FUZZ_STRESS: "$(PWUSAGE_FUZZ_STRESS)"
        PWUSAGE_FUZZ_SEED: "$(PWUSAGE_FUZZ_SEED)"
      targets:
        - PWUsageTests
