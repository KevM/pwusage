# SwiftLint for the iOS app. Run from the repository root:
#   swiftlint lint cmd/ios-app --strict
# Budgets are the campaign targets. There is no baseline: every violation must
# be fixed rather than recorded.
included:
  - cmd/ios-app
excluded:
  - cmd/ios-app/build
  - cmd/ios-app/PWUsage.xcodeproj
  - cmd/ios-app/.build
  # Vendored from fastlane (`fastlane snapshot init`); keep it byte-identical for upgrades.
  - cmd/ios-app/PWUsageScreenshots/SnapshotHelper.swift
opt_in_rules:
  - sorted_imports
  - empty_count
  - force_unwrapping
  - unhandled_throwing_task
line_length:
  warning: 120
file_length:
  warning: 400
  error: 500
type_body_length:
  warning: 350
  error: 450
function_body_length:
  warning: 50
  error: 100
cyclomatic_complexity:
  warning: 10
  error: 20
nesting:
  type_level: 1
  function_level: 2
large_tuple:
  warning: 2
  error: 3
function_parameter_count:
  warning: 5
  error: 8
