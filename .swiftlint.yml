# SwiftLint for the iOS app. Run from the repository root:
#   swiftlint lint cmd/ios-app --strict --baseline .swiftlint-baseline.json
# Budgets are the campaign targets. The checked-in baseline records the debt
# that predates them; regenerate it only when a PR lowers the count.
included:
  - cmd/ios-app
excluded:
  - cmd/ios-app/build
  - cmd/ios-app/PWUsage.xcodeproj
  - cmd/ios-app/.build
opt_in_rules:
  - sorted_imports
  - empty_count
  - force_unwrapping
  - unhandled_throwing_task
line_length:
  warning: 120
file_length:
  warning: 400
  error: 500
type_body_length:
  warning: 350
  error: 450
function_body_length:
  warning: 50
  error: 100
cyclomatic_complexity:
  warning: 10
  error: 20
nesting:
  type_level: 1
  function_level: 2
large_tuple:
  warning: 2
  error: 3
function_parameter_count:
  warning: 5
  error: 8
