# SwiftLint for the iOS app. Run from the repository root:
# `swiftlint lint --strict --baseline .swiftlint-baseline.json`.
# Size limits are raised to fit the largest existing files rather than
# reformatting them; lower them as those files are split (CODE_AUDIT.md §9.8, §9.9).
included:
  - cmd/ios-app
excluded:
  - cmd/ios-app/build
  - cmd/ios-app/PWUsage.xcodeproj
  - cmd/ios-app/.build
opt_in_rules:
  - sorted_imports
  - empty_count
  - force_unwrapping
  - unhandled_throwing_task
file_length:
  warning: 1350
  error: 1500
type_body_length:
  warning: 1100
  error: 1250
