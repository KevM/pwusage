services:
    pwusage:
        image: pwusage:latest
        build: .
        container_name: pwusage
        hostname: pwusage
        restart: unless-stopped
        volumes:
            - type: bind
              source: ./app/pb_data
              target: /pb_data
        ports:
            - "8090:8091"
        environment:
            - TZ=America/Chicago
            - PYPOWERWALL_BASE_URI=http://pypowerwall:8675

    pypowerwall:
        image: jasonacox/pypowerwall:latest
        container_name: pypowerwall
        hostname: pypowerwall
        restart: unless-stopped
        volumes:
            - type: bind
              source: ./app/.auth
              target: /app/.auth
        user: "${PWD_USER:-1000:1000}"
        ports:
            - "${PYPOWERWALL_PORTS:-8675:8675}"
        environment:
            - PW_AUTH_PATH=.auth
        env_file:
            - ./app/pypowerwall.env