services:
    pwusage:
        image: kevm/pwusage:latest
        build: .
        container_name: pwusage
        hostname: pwusage
        restart: unless-stopped
        volumes:
            - type: bind
              source: ./data/pb_data
              target: /pb_data
        ports:
            - "8090:8090"
        env_file:
            - ./cmd/pocketbase/.env
        environment:
            - TZ=America/Chicago
