services:
    pwusage:
        image: kevm/pwusage:latest
        build: .
        container_name: pwusage
        depends_on:
            - pypowerwall
        hostname: pwusage
        restart: unless-stopped
        volumes:
            - type: bind
              source: ./data/pb_data
              target: /pb_data
        ports:
            - "8090:8090"
        environment:
            - TZ=America/Chicago
            - PYPOWERWALL_BASE_URI=http://pypowerwall:8675
            - PUBLIC_API_BASE_URL=http://harrison-a7.donkey-hen.ts.net:8090

    pypowerwall:
        image: jasonacox/pypowerwall:latest
        container_name: pypowerwall
        hostname: pypowerwall
        restart: unless-stopped
        volumes:
            - type: bind
              source: ./data/.auth
              target: /app/.auth
        user: "${PWD_USER:-1000:1000}"
        ports:
            - "${PYPOWERWALL_PORTS:-8675:8675}"
        environment:
            - PW_AUTH_PATH=.auth
        env_file:
            - ./data/pypowerwall.env